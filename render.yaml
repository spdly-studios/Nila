services:
  - type: web
    name: nila-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: nila-call-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SNAPSERVE_API_KEY
        sync: false
      - key: SNAPSERVE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: AI_API_KEY
        sync: false
      - key: AI_ENDPOINT
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: AI_MODEL
        value: meta/muse-glimmer-30b
      - key: AI_TAG_MODEL
        value: nemotron-3-embed-1b
